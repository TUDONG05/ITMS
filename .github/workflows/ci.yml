name: ITMS CI Pipeline

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Cài đặt dependency
      - name: Install dependencies
        run: |
          cd backend
          uv sync

      # 2. Chạy Lint check (Ruff) theo yêu cầu checklist
      - name: Run Linter
        run: |
          cd backend
          uv run ruff check .

      # 3. Chạy Unit Test theo yêu cầu checklist
      - name: Run Tests
        run: |
          cd backend
          uv run pytest