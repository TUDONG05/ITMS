services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: itms-postgres
    environment:
      POSTGRES_DB: itms_db
      POSTGRES_USER: itms_admin
      POSTGRES_PASSWORD: itms_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio
    container_name: itms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: